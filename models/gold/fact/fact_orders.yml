version: 2

models:
  - name: fact_orders
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
              - store_id
          config:
            severity: error
    columns:
      - name: order_item_id
        data_tests:
          - not_null:
              config:
                severity: error
