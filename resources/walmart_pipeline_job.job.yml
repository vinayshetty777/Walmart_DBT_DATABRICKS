resources:
  jobs:
    walmart_pipeline_job:
      name: walmart_pipeline_job_1
      tasks:
        - task_key: Lakebase_ingestion
          disabled: false
          email_notifications: {}
          pipeline_task:
            pipeline_id: 576b9b68-9955-449c-829c-53f8168b1c83
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: dbt_transformation
          depends_on:
            - task_key: Lakebase_ingestion
          dbt_task:
            commands:
              - dbt deps
              - dbt build
            profiles_directory: .
            project_directory: .
            source: GIT
          disabled: false
          email_notifications: {}
          environment_key: dbt-default
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: base_view
          depends_on:
            - task_key: dbt_transformation
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: /Workspace/Users/vinayshetty7899@gmail.com/.bundle/walmart_metric_views/dev/files/src/base_views/base_views.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: creating_metric_view
          depends_on:
            - task_key: base_view
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: /Workspace/Users/vinayshetty7899@gmail.com/.bundle/walmart_metric_views/dev/files/src/metric_views/sales_order_metrics.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: walmart_kpi_dashboard
          depends_on:
            - task_key: creating_metric_view
          dashboard_task:
            dashboard_id: 01f1dbb72d27169084f8bab32f678e41
            subscription:
              subscribers:
                - user_name: vinayshetty7899@gmail.com
            warehouse_id: ${var.warehouse_id}
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
      environments:
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
            environment_version: "6"
      git_source:
        git_branch: main
        git_provider: gitHub
        git_url: https://github.com/vinayshetty777/Walmart_DBT_DATABRICKS.git
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
