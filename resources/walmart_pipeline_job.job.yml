resources:
  jobs:
    walmart_pipeline_job:
      name: walmart_pipeline_job_1
      tasks:
        - task_key: Lakebase_ingestion
          disabled: false
          email_notifications: {}
          pipeline_task:
            pipeline_id: ${resources.pipelines.ingest_walmart.id}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
      environments:
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
            environment_version: "6"
      git_source:
        git_branch: main
        git_provider: gitHub
        git_url: https://github.com/vinayshetty777/Walmart_DBT_DATABRICKS.git
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
